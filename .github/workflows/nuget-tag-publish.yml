name: publish nuget

on:
  push:
    tags:
    - '*'

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          3.1.x
          6.0.x
          8.0.x
          9.0.x
          10.0.x

    - name: Set tag to version
      env:
        RELEASE_TAG: ${{ github.ref }}
      run: dnx --yes DotNetCampus.TagToVersion -t "$env:RELEASE_TAG"

    - name: Build with dotnet
      run: |
        dotnet build --configuration Release
        dotnet pack --configuration Release --no-build

    - name: Push generated packages to GitHub Packages
      env:
        GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget push .\artifacts\package\release\*.nupkg --source "$env:GITHUB_PACKAGES_SOURCE" --api-key "$env:GITHUB_TOKEN" --skip-duplicate

    - name: Push generated packages to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NugetKey }}
      run: dotnet nuget push .\artifacts\package\release\*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
